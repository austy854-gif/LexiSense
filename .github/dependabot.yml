# Dependabot configuration for LexiSense
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems covered:
#   * frontend/  -> "npm" ecosystem (this is the one that also understands frontend/yarn.lock)
#   * backend/   -> "pip" ecosystem (backend/requirements.txt)
#   * /          -> GitHub Actions used by .github/workflows/
#
# Policy:
#   * One scheduled check per week per ecosystem.
#   * Minor + patch bumps are grouped into a single PR per ecosystem so the
#     review queue stays manageable; major bumps still open their own PR and
#     get reviewed individually.
#   * Security updates are never grouped - they open immediately, independently
#     of this weekly schedule (that is Dependabot's default for `groups`).
#   * open-pull-requests-limit caps the backlog if PRs pile up unmerged.

version: 2
updates:
  # ----------------------------------------------------------------- frontend --
  # package.json + yarn.lock live in frontend/, so this is where Dependabot
  # watches for drift (e.g. antd / ajv falling behind their declared ranges).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------------ backend --
  # Python service - backend/requirements.txt (and requirements-test.txt).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------------ github actions --
  # Keeps the workflows in .github/workflows/ (incl. CI) on current action versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
