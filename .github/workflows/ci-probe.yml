name: CI Probe (diagnostic)

# TEMPORARY diagnostic workflow -- delete once the frontend jobs in ci-cd.yml
# are confirmed green.
#
# Job logs and check-run annotations are not retrievable from this environment
# ("Must have admin rights" / annotations 404 without auth), so each probe
# encodes its answer in its own job conclusion.
#
# Findings so far:
#   run 1: registry reachable, emergent host reachable, but the install failed
#          (so it is the install, not network)
#   run 2: install on Node 18 WITHOUT a yarn cache -> SUCCESS
#          install on Node 20 WITH    a yarn cache -> FAILURE
#   run 2 changed two variables at once, so this run separates them: the same
#   frozen-lockfile install across Node 18/20 x cache/no-cache. Whichever jobs
#   fail name the culprit.
#
# No continue-on-error anywhere: each job's conclusion IS the result to read.
on:
  push:
    branches: ['**']

jobs:
  without-cache:
    name: nocache-node${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - name: yarn install --frozen-lockfile
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

  with-cache:
    name: cache-node${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: yarn install --frozen-lockfile
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
