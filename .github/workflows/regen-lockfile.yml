name: regen-lockfile
on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/frontend/**'
permissions:
  contents: write
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve package.json and regenerate yarn.lock
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git merge origin/main --no-commit --no-ff || true
          python3 - <<'PY'
          import re
          p='frontend/package.json'
          s=open(p).read()
          if '<<<<<<<' in s:
              def resolve(m):
                  ours=m.group(1).splitlines(); theirs=m.group(2).splitlines()
                  def key(l):
                      mm=re.match(r'\s*"([^"]+)"\s*:',l); return mm.group(1) if mm else None
                  out=[]; seen={}
                  for l in ours+theirs:
                      k=key(l)
                      if k is None: out.append(l); continue
                      if k in seen: out[seen[k]]=l
                      else: seen[k]=len(out); out.append(l)
                  return "\n".join(out)+"\n"
              s=re.sub(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/main\n', resolve, s, flags=re.S)
              open(p,'w').write(s)
          print('markers', s.count('<<<<<<<'))
          PY
          git add frontend/package.json
          git checkout origin/main -- frontend/yarn.lock
          cd frontend
          yarn install --network-timeout 600000
          cd ..
          git add frontend/yarn.lock
          git rm -f .github/workflows/regen-lockfile.yml
          git commit -m "Merge main into branch; resolve package.json and regenerate yarn.lock"
          git push origin HEAD
